$kind: http-request
name: List Activities
method: GET
url: '{{baseUrl}}/api/activities'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Has activities array", () => pm.expect(pm.response.json().activities).to.be.an("array"));
