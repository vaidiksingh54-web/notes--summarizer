$kind: http-request
name: Bootstrap
method: GET
url: '{{baseUrl}}/api/bootstrap'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Has profile, items, activities", () => {
        const json = pm.response.json();
        pm.expect(json.profile).to.be.an("object");
        pm.expect(json.items).to.be.an("array");
        pm.expect(json.activities).to.be.an("array");
      });
