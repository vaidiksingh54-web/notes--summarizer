$kind: http-request
name: Favorite Item
method: PATCH
url: '{{baseUrl}}/api/items/{{itemId}}/favorite'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    { "isFavorite": true }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("isFavorite is true", () => pm.expect(pm.response.json().item.isFavorite).to.be.true);
