$kind: http-request
name: List Items
method: GET
url: '{{baseUrl}}/api/items'
order: 1000
queryParams:
  - key: type
    value: all
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Has items array", () => pm.expect(pm.response.json().items).to.be.an("array"));
