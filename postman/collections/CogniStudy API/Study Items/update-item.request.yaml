$kind: http-request
name: Update Item
method: PUT
url: '{{baseUrl}}/api/items/{{itemId}}'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "id": "item-test-001",
      "type": "note",
      "title": "Photosynthesis Notes (Updated)",
      "category": "Biology",
      "date": "2026-10-11",
      "progress": 75,
      "content": "Updated content about photosynthesis and light reactions.",
      "isFavorite": false
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Title updated", () => pm.expect(pm.response.json().item.title).to.include("Updated"));
