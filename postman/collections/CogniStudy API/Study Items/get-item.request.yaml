$kind: http-request
name: Get Item
method: GET
url: '{{baseUrl}}/api/items/{{itemId}}'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Has item", () => pm.expect(pm.response.json().item).to.be.an("object"));
