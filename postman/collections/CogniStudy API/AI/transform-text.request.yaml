$kind: http-request
name: Transform Text
method: POST
url: '{{baseUrl}}/api/ai/transform'
order: 6000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "text": "Photosynthesis is the process by which plants make food using sunlight.",
      "action": "simplify"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Has transformed text", () => pm.expect(pm.response.json().transformed).to.be.a("string"));
