<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d1b">
  <title>Create Account - CogniStudy AI</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="auth-page">
  <div class="ambient-glow-top-right"></div>
  <div class="ambient-glow-bottom-left"></div>

  <nav class="app-navbar auth-navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo" aria-label="CogniStudy AI home">
        <span class="brand-icon-wrapper" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </span>
        <span>CogniStudy <span>AI</span></span>
      </a>
      <a href="index.html" class="auth-home-link">Back to home <span aria-hidden="true">↗</span></a>
    </div>
  </nav>

  <main class="auth-main auth-main-signup">
    <section class="auth-card auth-card-signup" aria-labelledby="auth-title">
      <div class="auth-brand-mark" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>
          <path d="M8 7h8M8 11h6"/>
        </svg>
      </div>
      <p class="auth-eyebrow">START LEARNING SMARTER</p>
      <h1 id="auth-title">Create your account</h1>
      <p class="auth-description">Set up your student profile and bring your study tools together in one place.</p>

      <button type="button" id="btn-google-signup" class="btn-google" aria-label="Sign up with Google">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Sign up with Google</span>
      </button>

      <div class="auth-divider" role="separator" aria-label="Or">
        <span>or with email</span>
      </div>

      <form id="form-signup" class="auth-form">
        <div class="auth-field">
          <label for="signup-name">Full name</label>
          <input id="signup-name" name="name" type="text" autocomplete="name" placeholder="Your name" required maxlength="100">
        </div>
        <div class="auth-field">
          <label for="signup-email">Email address</label>
          <input id="signup-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required maxlength="254">
        </div>
        <div class="auth-field">
          <label for="signup-password">Password <span class="auth-label-note">At least 8 characters</span></label>
          <div class="auth-password-input">
            <input id="signup-password" name="password" type="password" autocomplete="new-password" placeholder="Create a password" required minlength="8" maxlength="200">
            <button class="auth-password-toggle" type="button" data-password-toggle="signup-password" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
        </div>
        <div class="auth-field">
          <label for="signup-college">College</label>
          <input id="signup-college" name="college" type="text" autocomplete="organization" placeholder="Your college or university" required maxlength="150">
        </div>
        <div class="auth-field">
          <label for="signup-course">Course</label>
          <input id="signup-course" name="course" type="text" placeholder="Your course or program" required maxlength="150">
        </div>
        <div class="auth-field">
          <label for="signup-phone">Phone <span class="auth-label-note">Optional</span></label>
          <input id="signup-phone" name="phone" type="tel" autocomplete="tel" placeholder="Your phone number" maxlength="40">
        </div>
        <button type="submit" class="auth-submit">
          <span>Create account</span>
          <span aria-hidden="true">→</span>
        </button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
      <div class="auth-trust" aria-label="Account benefits">
        <span><span aria-hidden="true">✦</span> Private study space</span>
        <span><span aria-hidden="true">✓</span> Secure sign in</span>
      </div>
    </section>
    <p class="auth-footnote">Make every study session count.</p>
  </main>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
